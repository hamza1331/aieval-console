name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout console
        uses: actions/checkout@v4
        with:
          path: aieval-console

      - name: Checkout aieval-py dependency
        uses: actions/checkout@v4
        with:
          repository: hamza1331/aieval-py
          path: aieval-py

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: aieval-console/backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./aieval-py
          cd aieval-console/backend
          pip install .[dev]

      - name: Run Ruff Linting
        run: |
          cd aieval-console/backend
          ruff check app tests

      - name: Run Mypy Static Type Analysis
        run: |
          cd aieval-console/backend
          mypy app

      - name: Run Pytest Suite
        run: |
          cd aieval-console/backend
          pytest -v

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile and Build Bundle
        run: |
          cd frontend
          npm run build

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout console
        uses: actions/checkout@v4
        with:
          path: aieval-console

      - name: Checkout aieval-py dependency
        uses: actions/checkout@v4
        with:
          repository: hamza1331/aieval-py
          path: aieval-py

      - name: Build Docker image
        run: |
          cd aieval-console
          docker compose build
